<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dalil plain HTML example</title>
  <style>body{font:16px system-ui;margin:2rem;max-width:40rem} button{margin:.25rem .5rem .25rem 0;padding:.5rem .8rem}</style>
</head>
<body>
  <h1>Dalil, plain HTML</h1>
  <p>No framework. Trigger a failing request, then press the "Report a bug" button (or Ctrl/Cmd+Shift+B).</p>
  <button id="fetch500">fetch 500</button>
  <button id="xhr500">XHR 500</button>
  <button id="open">Open report</button>
  <pre id="out"></pre>

  <script src="../../dist/dalil.global.js"></script>
  <script>
    // Serve the repo root (`npx serve .`), start the mock API (`node examples/angular/mock-server.mjs`,
    // answers 500 with CORS on :4300), then open /examples/plain-html/.
    const API = 'http://localhost:4300'
    Dalil.init({
      project: 'example',
      publicKey: 'pk_example',
      endpoint: 'http://localhost:8787/v1/reports', // fake: submit will fail and queue offline
      apiOrigins: [API],
      enabled: true,
      theme: 'system',
      getContext: () => ({ userId: 'demo', userName: 'Demo user', tenant: 'Example' }),
    })
    const out = document.getElementById('out')
    document.getElementById('fetch500').onclick = () =>
      fetch(API + '/api/fail').then((r) => (out.textContent = 'fetch -> ' + r.status)).catch((e) => (out.textContent = 'fetch error: ' + e.message))
    document.getElementById('xhr500').onclick = () => {
      const x = new XMLHttpRequest()
      x.open('POST', API + '/api/fail')
      x.onloadend = () => (out.textContent = 'xhr -> ' + x.status)
      x.send('{"demo":true}')
    }
    document.getElementById('open').onclick = () => Dalil.open()
  </script>
</body>
</html>
